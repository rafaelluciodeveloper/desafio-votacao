spring:
  application:
    name: votacao

  # Profile padrao: H2 em arquivo. Persiste entre reinicios e nao exige
  # nenhuma dependencia externa para executar/avaliar a aplicacao.
  datasource:
    url: jdbc:h2:file:./data/votacao;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Timeouts das chamadas HTTP de saida (integracao externa de CPF)
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: 8080

# Configuracoes de dominio da aplicacao
votacao:
  sessao:
    duracao-padrao-minutos: 1
  cpf-client:
    # fake = client local aleatorio (default, sem rede). http = chama {base-url}/users/{cpf}.
    modo: ${CPF_CLIENT_MODO:fake}
    # Dominio do servico externo, parametrizavel para emulador / dispositivo / mock.
    base-url: ${CPF_CLIENT_BASE_URL:https://user-info.herokuapp.com}

# Exposicao de metricas para observabilidade / testes de performance
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.desafio.votacao: INFO
