# Infraestrutura de apoio ao desenvolvimento.
#
#   docker compose up -d postgres   PostgreSQL (Tarefa Bonus 2 - performance)
#   docker compose --profile qualidade up -d   + SonarQube (analise estatica)
#
# O SonarQube fica em um profile separado para nao subir junto no uso comum:
# ele consome bem mais memoria que o banco e so e necessario ao rodar a analise.
services:
  postgres:
    image: postgres:16-alpine
    container_name: votacao-postgres
    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: votacao
      POSTGRES_PASSWORD: votacao
    ports:
      # Porta do host configuravel: POSTGRES_PORT=5433 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - votacao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votacao"]
      interval: 5s
      timeout: 3s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: votacao-sonarqube
    profiles: ["qualidade"]
    environment:
      # Banco embutido: suficiente para analise local, nao para uso continuo.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - votacao-sonar-data:/opt/sonarqube/data
      - votacao-sonar-logs:/opt/sonarqube/logs
      - votacao-sonar-extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  votacao-pgdata:
  votacao-sonar-data:
  votacao-sonar-logs:
  votacao-sonar-extensions:
